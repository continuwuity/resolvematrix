name: Checks / Prek

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-checks:
    name: Pre-commit & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: https://forgejo.ellis.link/continuwuation/continuwuity/.forgejo/actions/setup-rust@main
        with:
          github-token: ${{ secrets.GH_PUBLIC_RO }}

      - name: Run prek
        run: |
          prek run \
            --all-files \
            --hook-stage manual \
            --show-diff-on-failure \
            --color=always \
            -v

      - name: Check Rust formatting
        run: |
          cargo fmt --all -- --check && \
            echo "✅ Formatting check passed" || \
            exit 1

  clippy-and-tests:
    name: Clippy and Cargo Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: https://forgejo.ellis.link/continuwuation/continuwuity/.forgejo/actions/setup-rust@main
        with:
          github-token: ${{ secrets.GH_PUBLIC_RO }}

      - name: Run Clippy lints
        run: >
          cargo clippy
          --workspace
          --all-features
          --locked
          --profile=test
          --no-deps
          --
          -D warnings

      - name: Run Cargo tests
        run: >
          cargo +nightly test
          --workspace
          --all-features
          --locked
          --profile=test
          --no-fail-fast
          --
          -Z unstable-options
          --format=json
          --report-time
          | tee target/cargo-test.json


      - name: Install markdown-test-report
        run: cargo-binstall -y --force --no-symlinks markdown-test-report
      - name: Generate test report
        # https://forgejo.org/2026-10-release-v17-0/#forgejo-actions-job-summaries
        run: >
          $CARGO_HOME/bin/markdown-test-report
          $FORGEJO_WORKSPACE/target/cargo-test.json
          --output=$FORGEJO_STEP_SUMMARY
          --summary
          --verbose

      - name: Install cargo-msrv
        run: cargo-binstall -y --no-symlinks cargo-msrv
      - name: Check MSRV
        run: cargo msrv verify
